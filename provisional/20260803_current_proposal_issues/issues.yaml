      placement: node
  executive_assessment:
    recommendation: Do not advance the set to Release Candidate yet.
    main_blockers:
    - Expression evaluation does not define the treatment of animation channels not selected by an expression extension or the mixing behavior when expressions overlap.
    - KHR_node_visibility_hint cannot implement its stated descendant-override behavior by setting KHR_node_visibility on an ancestor because the latter always hides the entire subtree.
    - Camera and visibility roles mix normative behavior with advisory hints, and the active view-context model is not defined.
    - Several schemas validate structurally invalid or semantically empty objects, and most cross-object rules are not fully specified.
    release_strategy: >-
      Advance independently useful extensions separately. In particular, do not freeze the expression execution model, reference-pose model, or view-context model merely because they are included in one pull request.

taxonomies:
  severity:
    blocker: Different conforming implementations can produce materially different results or valid data cannot be implemented reliably.
    major: The design or schema permits ambiguous, non-interoperable, or internally inconsistent data.
    minor: Naming, examples, wording, or documentation should be corrected before the Release Candidate text is frozen.
  status:
    open: Unresolved and not yet ready for a concrete change.
    decision-needed: Requires an explicit design decision.
    ready: Decision is settled and the change can be implemented.
    resolved: Required work is complete.
    rejected: Finding was considered and intentionally rejected.
    out-of-scope: Finding does not belong to the current review scope.
  primary_workstream:
    design: Settle behavior, scope, ownership, composition, or the data model before drafting changes.
    schema-and-naming: Change machine-readable structure, constraints, extension names, property names, tokens, or vocabulary identifiers.
    normative: Define required behavior, validity, formulas, fallback behavior, or conformance requirements.
    validator: Implement semantic checks that JSON Schema cannot express by itself.
    non-normative: Improve rationale, implementation guidance, explanatory prose, or other informative material.
    examples-tests: Add or correct examples, fixtures, boundary cases, and conformance tests.
  classification_rules:
  - Severity, status, and primary_workstream are independent axes.
  - primary_workstream identifies the next kind of work and is intentionally singular.
  - A design finding remains under design until its decision is settled, even if it will later require schema, normative text, validator logic, and tests.
  - Machine-readable public names are managed with schema; behavior-affecting terminology belongs under normative; prose-only terminology belongs under non-normative.

release_candidate_gates:
- id: RC-01
  gate: Stable normative behavior
  current_issue: Expression sampling, animation mixing, view contexts, and hierarchy behavior remain runtime-defined or contradictory.
- id: RC-04
  gate: Schema completeness
  current_issue: Semantic constraints are prose-only; empty mappings, empty identifiers, invalid combinations, and duplicate semantic references remain valid.
- id: RC-11
  gate: Stable naming
  current_issue: At minimum, morphtarget, lookat, expression, label, and several role names need a final naming decision.
- id: RC-12
  gate: Self-contained specification
  current_issue: A private or working Google document is referenced as animation guidance, and some required behavior exists only in pull-request discussion.

proposed_resolution_order:
- Define the object and ownership model, including one character per asset, scene membership, and skin association.
- Define the expression execution model with exact sampling and mixing equations, then decide whether separate channel-type extensions remain necessary.
- Resolve the node-visibility inheritance contradiction and define a per-view render predicate shared by node and primitive visibility.
- Simplify camera and look-at metadata into testable roles and explicit relationships; remove examples whose behavior is not encoded.
- Freeze extension, property, and token names.

minimum_rc_acceptance_checklist:
- Every standard token has normative, testable behavior.
- Expression value-to-animation sampling is exact.
- Overlapping expression outputs are deterministic or prohibited.
- Scene membership and skins have defined scope.
- Visibility inheritance and KHR_node_visibility composition are consistent.
- Camera target orientation and role-specific property combinations are complete.
- Reference poses select a skin or rig and obey static-pose constraints.
- Skeleton and expression mappings have deterministic semantics.
- No normative requirement exists only in a pull-request comment or private document.

