inventory:
  title: "KHR Character Phase 1: Release Candidate Issue Inventory"
  purpose: >-
    Independent technical review of KhronosGroup/glTF pull request #2512 to identify unresolved specification work before the proposed extension set can be called a Release Candidate.
  provenance:
    generated_by: Codex (GPT-5.6 Sol)
    review_status: Unorganized and not reviewed by a human; intended as a starting point for discussion, not a final assessment.
    pull_request: https://github.com/KhronosGroup/glTF/pull/2512
    reviewed_commit: bf38201bc5f4ed5de815c79ad43f4fc281bee83f
    retrieved_on: "2026-08-03"
    pull_request_status_at_retrieval: draft
  scope:
    included: >-
      Unresolved design questions, contradictions, missing validation rules, naming concerns, and editorial defects. Some findings may be resolved by narrowing the scope and documenting the decision rather than adding a feature.
    excluded: >-
      Release Candidate deliverables and process topics, including registry entries, official Sample Viewer or glTF Validator support, official sample assets, conformance and interoperability matrices, and CLA status.
    extensions:
